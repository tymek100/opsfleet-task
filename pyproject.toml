[project]
name = "opsfleet-retail-agent"
version = "0.2.0"
description = "Autonomous retail analyst with Golden retrieval and evaluated completion"
requires-python = ">=3.12"
dependencies = [
  "google-adk>=2.12,<3", "google-genai>=2.32,<3", "google-cloud-bigquery>=3.46,<4",
  "pydantic>=2.14,<3", "pydantic-settings>=2.16,<3", "sqlglot>=30.24,<31",
  "typer>=0.27,<1", "rich>=15,<16", "python-dotenv>=1.2,<2", "duckdb>=2.0.0", "jsonschema>=4.0",
  "prompt-toolkit>=3.0.52,<4",
]
[project.scripts]
retail-agent = "retail_agent.cli:app"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]
[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1.400", "pytest>=8.3", "pytest-cov>=6", "pytest-asyncio>=0.26", "pytest-socket>=0.7", "hypothesis>=6.130"]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", "docs/task", "legacy", "evals"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib --disable-socket --allow-unix-socket -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: external model or warehouse integration"]
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
