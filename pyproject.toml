[project]
name = "retail-insight-agent"
version = "0.3.0"
description = "A small retail agent with a custom LangGraph loop and BigQuery tools"
requires-python = ">=3.12"
dependencies = [
  "google-genai==2.32.0",
  "google-cloud-bigquery>=3.46,<4",
  "langgraph>=1,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "python-dotenv>=1.2,<2",
  "sqlglot>=30.24,<31",
  "typer>=0.27,<1",
  "rich>=15,<16",
  "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
retail-agent = "retail_insight.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_insight"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.26", "pytest-socket>=0.7", "ruff>=0.11", "pyright>=1.1.400"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
