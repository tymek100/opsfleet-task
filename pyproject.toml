[project]
name = "retail-insight-agent"
version = "0.2.0"
description = "Multi-agent retail analytics with reviewed answers and independent evaluation"
requires-python = ">=3.12"
dependencies = [
  "google-genai==2.32.0",
  "google-cloud-bigquery>=3.46,<4",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlglot>=30.24,<31",
  "typer>=0.27,<1",
  "rich>=15,<16",
  "python-dotenv>=1.2,<2",
  "duckdb>=2.0.0",
  "prompt-toolkit>=3.0.52,<4",
  "pytz>=2025.2",
  "mcp>=1.26,<2",
  "uvicorn>=0.54,<1",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "starlette>=1.3.1,<2",
  "pyyaml>=6,<7",
  "opentelemetry-sdk>=1.45,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b59,<2",
  "azure-ai-projects>=2.11,<3",
  "azure-identity>=1.27,<2",
]
[project.scripts]
agent-chat = "retail_insight.interfaces.agent_cli:app"
retail-agent = "retail_insight.interfaces.cli:app"
retail-eval = "evaluation.cli:app"
retail-stack = "retail_insight.interfaces.stack_cli:app"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/retail_insight", "evaluation"]
[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1.400", "pytest>=8.3", "pytest-cov>=6", "pytest-asyncio>=0.26", "pytest-socket>=0.7", "hypothesis>=6.130"]
evaluation = []
foundry = ["langchain-azure-ai[hosting]>=1.4,<2", "azure-identity>=1.25,<2", "azure-ai-contentsafety>=1.1.0b1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/task"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib --disable-socket --allow-unix-socket -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: external model or warehouse integration"]
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "evaluation"]
extraPaths = ["src", "."]
typeCheckingMode = "basic"
