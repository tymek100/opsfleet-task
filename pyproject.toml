[project]
name = "retail-insight-agent"
version = "0.2.0"
description = "Multi-agent retail analytics with reviewed answers and independent evaluation"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.12.0",
  "google-genai==2.32.0",
  "google-cloud-bigquery>=3.46,<4",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlglot>=30.24,<31",
  "typer>=0.27,<1",
  "rich>=15,<16",
  "python-dotenv>=1.2,<2",
  "duckdb>=2.0.0",
  "prompt-toolkit>=3.0.52,<4",
  "pytz>=2025.2",
  "a2a-sdk[http-server]==1.3.1",
  "mcp>=1.26,<2",
  "uvicorn>=0.54,<1",
]
[project.scripts]
agent-chat = "retail_insight.interfaces.agent_cli:app"
retail-agent = "retail_insight.interfaces.cli:app"
retail-eval = "evaluation.cli:app"
retail-stack = "retail_insight.interfaces.stack_cli:app"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/retail_insight", "evaluation"]
[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1.400", "pytest>=8.3", "pytest-cov>=6", "pytest-asyncio>=0.26", "pytest-socket>=0.7", "hypothesis>=6.130"]
evaluation = [
  "arize-phoenix-client==3.7.0", "arize-phoenix-evals==3.10.0",
  "arize-phoenix-otel==0.16.0", "openinference-instrumentation-google-adk==1.1.9",
  "opentelemetry-exporter-otlp==1.42.1",
]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/task"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:phoenix --strict-markers --import-mode=importlib --disable-socket --allow-unix-socket -m 'not live and not phoenix'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: external model or warehouse integration", "phoenix: local Phoenix service integration"]
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "evaluation"]
extraPaths = ["src", "."]
typeCheckingMode = "basic"
