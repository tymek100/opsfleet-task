name: Offline quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.10.7"
          enable-cache: true
      - run: uv sync --python 3.12 --group evaluation
      - run: uv run --group evaluation ruff check .
      - run: uv run --group evaluation ruff format --check .
      - run: uv run --group evaluation pyright
      - run: uv run --group evaluation pytest --cov=retail_insight --cov-report=term-missing
      - run: uv run --group evaluation retail-eval validate
