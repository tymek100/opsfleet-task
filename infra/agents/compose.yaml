name: retail-agents

x-common-environment: &common-environment
  BACKEND: ${RETAIL_STACK_BACKEND:-fixture}
  DATA_DIR: /data
  RETAIL_DATA_PROFILE: ${RETAIL_STACK_DATA_PROFILE:-default}
  A2A_SIGNING_KEY_FILE: /run/secrets/a2a_signing_key
  A2A_ACCESS_TOKEN_FILE: /run/secrets/a2a_access_token
  A2A_CATALOG_PATH: /app/catalog.json
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
  PHOENIX_PROJECT_NAME: retail-multi-agent
  TRACE_CONTENT_MODE: ${RETAIL_STACK_TRACE_MODE:-metadata}

x-common-service: &common-service
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  networks: [agents, phoenix]
  secrets: [model_env, a2a_signing_key, a2a_access_token]

x-build: &build
  context: ../..
  dockerfile: infra/agents/Dockerfile

services:
  retail:
    <<: *common-service
    image: retail-analyst:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: retail
    environment:
      <<: *common-environment
      A2A_PUBLIC_URL: http://retail:8000
      RETAIL_WAREHOUSE_ENV_FILE: /run/secrets/warehouse_env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/warehouse_adc
    ports: ["127.0.0.1:${RETAIL_PORT:-8001}:8000"]
    secrets: [model_env, warehouse_env, warehouse_adc, a2a_signing_key, a2a_access_token]
    volumes:
      - retail-data:/data
      - ./catalog.json:/app/catalog.json:ro

  inventory:
    <<: *common-service
    image: retail-inventory:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: inventory
    environment:
      <<: *common-environment
      A2A_PUBLIC_URL: http://inventory:8000
      RETAIL_WAREHOUSE_ENV_FILE: /run/secrets/warehouse_env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/warehouse_adc
    ports: ["127.0.0.1:${INVENTORY_PORT:-8002}:8000"]
    secrets: [model_env, warehouse_env, warehouse_adc, a2a_signing_key, a2a_access_token]
    volumes:
      - inventory-data:/data
      - ./catalog.json:/app/catalog.json:ro

  distribution:
    <<: *common-service
    image: retail-distribution:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: distribution
    environment:
      <<: *common-environment
      A2A_PUBLIC_URL: http://distribution:8000
      RETAIL_WAREHOUSE_ENV_FILE: /run/secrets/warehouse_env
      RETAIL_MAPS_ENV_FILE: /run/secrets/maps_env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/warehouse_adc
    ports: ["127.0.0.1:${DISTRIBUTION_PORT:-8003}:8000"]
    secrets: [model_env, warehouse_env, warehouse_adc, maps_env, a2a_signing_key, a2a_access_token]
    volumes:
      - distribution-data:/data
      - ./catalog.json:/app/catalog.json:ro

  coordinator:
    <<: *common-service
    image: retail-coordinator:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: coordinator
    environment:
      <<: *common-environment
      A2A_PUBLIC_URL: http://coordinator:8000
    ports: ["127.0.0.1:${COORDINATOR_PORT:-8004}:8000"]
    depends_on:
      retail: {condition: service_healthy}
      inventory: {condition: service_healthy}
      distribution: {condition: service_healthy}
    volumes:
      - coordinator-data:/data
      - ./catalog.json:/app/catalog.json:ro

  inspector:
    profiles: [debug]
    image: ghcr.io/a2aproject/a2a-inspector:v1.0.0-alpha.2@sha256:699e8eab72b5f46f9ce95d10acc7be51a99c3d9f3649da009e534889871083e2
    platform: linux/amd64
    command: ["--hosted", "--catalog", "/config/inspector-catalog.json", "--egress-allow", "coordinator", "--egress-allow", "retail", "--egress-allow", "inventory", "--egress-allow", "distribution"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [agents]
    depends_on:
      coordinator: {condition: service_healthy}
    volumes:
      - ../../.artifacts/agents/inspector-catalog.json:/config/inspector-catalog.json:ro

  gui:
    image: retail-gui:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: gui
    environment:
      A2A_CATALOG_PATH: /app/catalog.json
      A2A_ACCESS_TOKEN_FILE: /run/secrets/a2a_access_token
      GUI_PUBLIC_PORT: ${INSPECTOR_PORT:-8080}
      BACKEND: ${RETAIL_STACK_BACKEND:-fixture}
      RETAIL_DATA_PROFILE: ${RETAIL_STACK_DATA_PROFILE:-default}
    ports: ["127.0.0.1:${INSPECTOR_PORT:-8080}:8080"]
    restart: unless-stopped
    # Let in-flight streams finish within the gateway's 180-second task allowance.
    stop_grace_period: 240s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [agents]
    secrets: [a2a_access_token]
    depends_on:
      coordinator: {condition: service_healthy}
    volumes:
      - ./catalog.json:/app/catalog.json:ro
      - gui-data:/data

  inspector-gui:
    profiles: [debug]
    image: retail-inspector-gui:${RETAIL_STACK_REVISION:-local}
    build:
      <<: *build
      target: inspector-gui
    environment:
      A2A_CATALOG_PATH: /app/catalog.json
      A2A_ACCESS_TOKEN_FILE: /run/secrets/a2a_access_token
      GUI_PUBLIC_PORT: ${INSPECTOR_DEBUG_PORT:-8081}
    ports: ["127.0.0.1:${INSPECTOR_DEBUG_PORT:-8081}:8080"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [agents]
    secrets: [a2a_access_token]
    depends_on:
      inspector: {condition: service_started}
    volumes:
      - ./catalog.json:/app/catalog.json:ro

networks:
  agents:
  phoenix:
    external: true
    name: phoenix_default

volumes:
  retail-data:
  inventory-data:
  distribution-data:
  coordinator-data:
  gui-data:

secrets:
  model_env:
    file: ../../.artifacts/agents/secrets/model.env
  warehouse_env:
    file: ../../.artifacts/agents/secrets/warehouse.env
  warehouse_adc:
    file: ../../.artifacts/agents/secrets/warehouse_adc.json
  maps_env:
    file: ../../.artifacts/agents/secrets/maps.env
  a2a_signing_key:
    file: ../../.artifacts/agents/secrets/a2a_signing_key
  a2a_access_token:
    file: ../../.artifacts/agents/secrets/a2a_access_token
